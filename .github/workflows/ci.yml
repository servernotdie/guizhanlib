name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '*.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches:
      - master
    paths:
      - '*.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure git
        run: |
          git config user.name "mytai20100"
          git config user.email "142713298+Mytai20100@users.noreply.github.com"

      - name: Apply patches
        run: bash patches/patch.sh

      - name: Environment Setup
        id: env-setup
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          TAG="build-$(date +'%Y%m%d')-$SHORT_COMMIT_HASH"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_ENV"
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Select jar
        run: |
          cd guizhanlib-all/build/libs
          FILE=$(find . -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -printf "%f\n")
          [ -n "$FILE" ]
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Publish to repo
        run: ./gradlew publish
        env:
          MAVEN_ACCOUNT: '${{ secrets.MAVEN_ACCOUNT }}'
          MAVEN_PASSWORD: '${{ secrets.MAVEN_PASSWORD }}'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: guizhanlib-all/build/libs/${{ env.FILE }}

      - name: Create Release
        run: |
          gh release create "$TAG" \
            --title "guizhanlib Build $TAG" \
            --notes "Auto build from commit ${{ github.sha }}" \
            --prerelease \
            "guizhanlib-all/build/libs/$FILE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
